name: devproven-analyze

# Reusable workflow. The caller owns the repository; this file owns the computation.
# Nothing from the caller's tree is checked out or executed: only commit objects are
# fetched (--filter=tree:0) into a fresh bare repository that has no caller config.

on:
  workflow_call:
    inputs:
      attest:
        description: Also create a GitHub artifact attestation for result.json
        type: boolean
        default: false

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Fetch commit objects only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git init -q --bare "$RUNNER_TEMP/repo.git"
          git --git-dir="$RUNNER_TEMP/repo.git" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch -q --filter=tree:0 --no-tags "https://github.com/$REPO" "$SHA"
          echo "fetched"

      - name: Compute result
        id: compute
        env:
          SHA: ${{ github.sha }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          # %an/%ae: raw author, .mailmap is NOT applied (it would be caller-controlled input).
          git --git-dir=repo.git log --no-merges --format='%an%x09%ae%x09%ad' --date=format:%Y-%m "$SHA" > log.tsv
          node - <<'EOF'
          const fs = require('fs');
          const lines = fs.readFileSync('log.tsv', 'utf8').split('\n').filter(Boolean);
          const byAuthor = {}, byMonth = {}, byAuthorMonth = {};
          for (const l of lines) {
            const [name, email, month] = l.split('\t');
            const a = `${name} <${email}>`;
            byAuthor[a] = (byAuthor[a] || 0) + 1;
            byMonth[month] = (byMonth[month] || 0) + 1;
            byAuthorMonth[a] ??= {};
            byAuthorMonth[a][month] = (byAuthorMonth[a][month] || 0) + 1;
          }
          const sort = o => Object.fromEntries(Object.keys(o).sort().map(k => [k, (o[k] && typeof o[k] === 'object') ? sort(o[k]) : o[k]]));
          const result = {
            schema: 'devproven-attest-test/1',
            repository_id: process.env.REPOSITORY_ID,
            commit: process.env.SHA,
            total_commits: lines.length,
            by_author: sort(byAuthor),
            by_month: sort(byMonth),
            by_author_month: sort(byAuthorMonth),
          };
          fs.writeFileSync('result.json', JSON.stringify(result, null, 2) + '\n');
          console.log(`commits=${lines.length} authors=${Object.keys(byAuthor).length} months=${Object.keys(byMonth).length}`);
          EOF
          digest=$(sha256sum result.json | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "result.json sha256=$digest"

      - name: Request OIDC token bound to the result
        env:
          DIGEST: ${{ steps.compute.outputs.digest }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          aud="devproven:sha256:$DIGEST"
          resp=$(curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -G --data-urlencode "audience=$aud" "$ACTIONS_ID_TOKEN_REQUEST_URL")
          token=$(printf '%s' "$resp" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).value)')
          echo "::add-mask::$token"
          printf '%s' "$token" > oidc-token.jwt
          echo "token stored (length $(wc -c < oidc-token.jwt))"

      - name: Decode token claims (no raw token in the log)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          node - <<'EOF'
          const fs = require('fs');
          const [h, p] = fs.readFileSync('oidc-token.jwt', 'utf8').split('.');
          const dec = s => JSON.parse(Buffer.from(s, 'base64url').toString('utf8'));
          const header = dec(h), claims = dec(p);
          fs.writeFileSync('claims.json', JSON.stringify({ header, claims }, null, 2) + '\n');
          console.log('HEADER ' + JSON.stringify(header));
          for (const k of Object.keys(claims).sort()) console.log(`CLAIM ${k} = ${JSON.stringify(claims[k])}`);
          const iso = t => new Date(t * 1000).toISOString();
          console.log(`VALIDITY iat=${iso(claims.iat)} nbf=${iso(claims.nbf)} exp=${iso(claims.exp)} exp-iat=${claims.exp - claims.iat}s exp-nbf=${claims.exp - claims.nbf}s`);
          EOF

      - name: Verify token signature against GitHub JWKS
        env:
          DIGEST: ${{ steps.compute.outputs.digest }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          node - <<'EOF'
          const fs = require('fs'), crypto = require('crypto');
          (async () => {
            const token = fs.readFileSync('oidc-token.jwt', 'utf8');
            const [h, p, s] = token.split('.');
            const header = JSON.parse(Buffer.from(h, 'base64url'));
            const claims = JSON.parse(Buffer.from(p, 'base64url'));
            const jwks = await (await fetch('https://token.actions.githubusercontent.com/.well-known/jwks')).json();
            const jwk = jwks.keys.find(k => k.kid === header.kid);
            if (!jwk) throw new Error('kid not in JWKS: ' + header.kid);
            const key = crypto.createPublicKey({ key: jwk, format: 'jwk' });
            const ok = crypto.verify('RSA-SHA256', Buffer.from(`${h}.${p}`), key, Buffer.from(s, 'base64url'));
            const tampered = crypto.verify('RSA-SHA256', Buffer.from(`${h}.${p}x`), key, Buffer.from(s, 'base64url'));
            const actual = crypto.createHash('sha256').update(fs.readFileSync('result.json')).digest('hex');
            console.log(`VERIFY alg=${header.alg} kid=${header.kid} jwks_keys=${jwks.keys.length}`);
            console.log(`VERIFY signature_valid=${ok} tampered_payload_valid=${tampered}`);
            console.log(`VERIFY iss_ok=${claims.iss === 'https://token.actions.githubusercontent.com'}`);
            console.log(`VERIFY aud_matches_result=${claims.aud === 'devproven:sha256:' + actual}`);
            console.log(`VERIFY not_expired=${claims.exp > Date.now() / 1000}`);
            if (!ok || tampered) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Push log (repository activity) with the job token
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP"
          node - <<'EOF'
          const fs = require('fs');
          (async () => {
            let url = `https://api.github.com/repos/${process.env.REPO}/activity?per_page=100`;
            const all = []; let pages = 0, status = 0;
            while (url) {
              const r = await fetch(url, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
              status = r.status; pages++;
              if (!r.ok) { console.log(`ACTIVITY http=${r.status} body=${(await r.text()).slice(0, 300)}`); break; }
              all.push(...await r.json());
              const m = (r.headers.get('link') || '').match(/<([^>]+)>;\s*rel="next"/);
              url = m ? m[1] : null;
            }
            const types = {};
            for (const a of all) types[a.activity_type] = (types[a.activity_type] || 0) + 1;
            const ts = all.map(a => a.timestamp).sort();
            console.log(`ACTIVITY http=${status} pages=${pages} entries=${all.length} types=${JSON.stringify(types)} oldest=${ts[0]} newest=${ts[ts.length - 1]}`);
            fs.writeFileSync('activity.json', JSON.stringify(all.map(a => ({ id: a.id, activity_type: a.activity_type, timestamp: a.timestamp, before: a.before, after: a.after, ref: a.ref })), null, 2) + '\n');
          })().catch(e => { console.log('ACTIVITY error ' + e.message); fs.writeFileSync('activity.json', '[]\n'); });
          EOF
          test -f activity.json || echo '[]' > activity.json

      - name: Artifact name
        id: name
        run: echo "suffix=$(head -c 4 /dev/urandom | xxd -p)" >> "$GITHUB_OUTPUT"

      - name: Upload proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: devproven-proof-${{ steps.name.outputs.suffix }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/result.json
            ${{ runner.temp }}/claims.json
            ${{ runner.temp }}/oidc-token.jwt
            ${{ runner.temp }}/activity.json

      - name: GitHub artifact attestation
        id: attest
        if: ${{ inputs.attest }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/result.json

      - name: Attestation outcome
        if: ${{ inputs.attest }}
        env:
          OUTCOME: ${{ steps.attest.outcome }}
          ATT_URL: ${{ steps.attest.outputs.attestation-url }}
          ATT_ID: ${{ steps.attest.outputs.attestation-id }}
        run: echo "ATTEST outcome=$OUTCOME id=$ATT_ID url=$ATT_URL"
